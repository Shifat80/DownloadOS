[package]
name = "downloados"
version = "0.1.0"
description = "DownloadOS - local-first download manager"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "downloados_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime for the download engine (bounded feature set).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
# HTTP client. rustls avoids a system OpenSSL dependency; "stream" enables
# chunked response streaming so we never buffer a whole file in memory.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
# Structured, derivable error types for the engine taxonomy.
thiserror = "2"
# Strict URL parsing/validation for SSRF and scheme checks.
url = "2"
# Stable task identifiers.
uuid = { version = "1", features = ["v4"] }
# Local task persistence. "bundled" compiles SQLite from source so there is no
# system SQLite dependency to manage across platforms.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# Minimal local HTTP server used only by integration tests (never shipped),
# per docs/TEST_PLAN.md which requires a controlled test server.
tiny_http = "0.12"
tempfile = "3"
# Async test runtime for #[tokio::test] in integration tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
