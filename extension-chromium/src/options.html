<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DownloadOS Handoff — Options</title>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        max-width: 420px;
        margin: 32px auto;
        padding: 0 16px;
        color: #1a1d21;
      }
      h1 {
        font-size: 18px;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        font: inherit;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 20px;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #4f46e5;
        background: #4f46e5;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #4f46e5;
      }
      .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 4px;
      }
      #status {
        margin-top: 16px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>DownloadOS Handoff</h1>
    <p class="hint">
      In the DownloadOS desktop app, open <strong>Settings → Browser pairing</strong> and copy the
      pairing code and port here.
    </p>

    <label for="port">Port</label>
    <input id="port" type="number" min="1" max="65535" />

    <label for="token">Pairing code</label>
    <input id="token" type="text" spellcheck="false" autocomplete="off" />

    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary" type="button">Test connection</button>
    </div>
    <div id="status" role="status"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
